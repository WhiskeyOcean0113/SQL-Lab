kind: predict
difficulty: 2
lesson_ref: having-vs-where/core
objective: having-vs-where/where-changes-having
prompt:
  zh: |
    不算没有分类的那件，各分类的商品数和其中价格不低于 30 美元的商品数如下：

    | `category_id` | 商品数 | 其中 ≥ 30 美元 |
    |---|---|---|
    | 1 | 3 | 2 |
    | 2 | 4 | 4 |
    | 3 | 3 | 2 |
    | 4 | 2 | 0 |
    | 5 | 3 | 2 |

    没有分类的那件商品卖 50 美元。不要运行，先判断这条查询返回什么。
  en: |
    Leaving out the product without a category, here is each category's number of products, and how many of them cost 30 dollars or more:

    | `category_id` | products | of which ≥ 30 dollars |
    |---|---|---|
    | 1 | 3 | 2 |
    | 2 | 4 | 4 |
    | 3 | 3 | 2 |
    | 4 | 2 | 0 |
    | 5 | 3 | 2 |

    The product without a category costs 50 dollars. Without running it, decide what this query returns.
query: |
  SELECT category_id, count(*) AS products
  FROM products
  WHERE price >= 30
  GROUP BY category_id
  HAVING count(*) >= 3
  ORDER BY category_id;
choices:
  - zh: 一行：分类 2，`products` 是 4
    en: "One row: category 2, with `products` 4"
    why:
      zh: 对。`WHERE` 先去掉 30 美元以下的商品，`HAVING` 数的是剩下的；只有分类 2 还剩 3 件以上。
      en: Right. `WHERE` first removes the products under 30 dollars, and `HAVING` counts what is left; only category 2 still has 3 or more.
  - zh: 四行：分类 1、2、3、5，`products` 是 3、4、3、3
    en: "Four rows: categories 1, 2, 3 and 5, with `products` 3, 4, 3 and 3"
    why:
      zh: 这是没有 `WHERE` 时的结果。`WHERE` 在分组之前执行，`HAVING` 看不到被它去掉的行。
      en: That is the result without `WHERE`. `WHERE` runs before grouping, and `HAVING` never sees the rows it removed.
  - zh: 四行：分类 1、2、3、5，`products` 是 2、4、2、2
    en: "Four rows: categories 1, 2, 3 and 5, with `products` 2, 4, 2 and 2"
    why:
      zh: 这里 `products` 用的是筛选后的数字，组却按筛选前的数字挑。其实 `HAVING` 里的 `count(*)` 和 SELECT 里的是同一个值，都只数 `WHERE` 留下的行。
      en: Here `products` uses the filtered counts but the groups are chosen on the unfiltered ones. In fact the `count(*)` in `HAVING` is the same value as the one in SELECT; both count only the rows `WHERE` kept.
  - zh: 报错：`price` 不是{{term:grouping-column}}
    en: "An error: `price` is not a {{term:grouping-column}}"
    why:
      zh: "`price` 只用在 `WHERE` 里，那时还没有分组，每一行都有自己的价格，完全合法。"
      en: "`price` is used only in `WHERE`, before any grouping, where every row has its own price. That is perfectly legal."
answer: 0
explain:
  zh: 执行顺序是 `WHERE` → `GROUP BY` → `HAVING`。`WHERE price >= 30` 先把每个分类缩小到第三列的数字，没有分类的那组只剩 1 件；`HAVING count(*) >= 3` 再按这些数字挑组，只有分类 2 的 4 件过关。
  en: "The order is `WHERE` → `GROUP BY` → `HAVING`. `WHERE price >= 30` first shrinks each category to the number in the last column, and the group without a category to 1; `HAVING count(*) >= 3` then picks groups by those numbers, and only category 2, with 4, passes."
verify: { rows: 1 }
