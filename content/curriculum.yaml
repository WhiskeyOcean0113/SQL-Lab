# The one learning path. Order here is the only place order is defined:
# lesson folders are not numbered. A lesson moves from `planned` to `lessons`
# once its folder under content/lessons/ exists and passes validate.
#
# Sources the sequence draws on: Stanford CS145 and CMU 15-445 (SQL lectures),
# the PostgreSQL manual (Part II, "The SQL Language"), and research on novice
# SQL errors (Taipalus & Perälä 2019; Miedema et al. 2021).

modules:
  - id: m0
    title: { zh: "{{term:relational-model}}", en: "The {{term:relational-model}}" }
    summary:
      zh: 在写第一条 query 之前，先弄清楚数据长什么样，以及数据库是按什么顺序理解一条 query 的。
      en: Before the first query, learn what the data looks like and the order in which the database reads a query.
    lessons: [tables-rows-columns, keys, query-evaluation-order]
    planned: []

  - id: m1
    title: { zh: 单表查询, en: Querying one table }
    summary:
      zh: 从一张表里取出你要的列和行，并按需要排序。
      en: Pick the columns and rows you need from one table, in the order you need them.
    lessons: [select-basics, where-comparisons, and-or-not, in-between-like, null-logic, order-limit, distinct]
    planned: []

  - id: m2
    title: { zh: "{{term:expression}}与{{term:function}}", en: "{{Term:expression|Expressions}} and {{term:function|functions}}" }
    summary:
      zh: 在查询里计算新值：算术、字符串、日期时间、条件表达式和类型转换。
      en: Compute new values in a query with arithmetic, strings, dates, conditionals and casts.
    lessons: [arithmetic, string-functions, dates-times, case-expressions, type-casts]
    planned: []

  - id: m3
    title: { zh: "{{term:aggregation}}", en: "{{Term:aggregation}}" }
    summary:
      zh: 把很多行汇总成一行，再按组汇总，并筛选汇总后的结果。
      en: Collapse many rows into one, then one per group, and filter the groups.
    lessons: [aggregate-functions, group-by, having-vs-where, aggregates-null]
    planned: []

  - id: m4
    title: { zh: "多表{{term:join}}", en: "{{Term:join|Joining}} tables" }
    summary:
      zh: 用共同的列把多张表拼起来，并理解每种 join 会保留哪些行。
      en: Combine tables through shared columns, and know which rows each kind of join keeps.
    lessons: [inner-join, outer-joins, self-joins, cross-join, joins-aggregation]
    planned: []

  - id: m5
    title: { zh: "{{term:subquery}}与{{term:set-operation}}", en: "{{Term:subquery|Subqueries}} and {{term:set-operation|set operations}}" }
    summary:
      zh: 把一条 query 的结果当作另一条 query 的输入，以及合并、相交、相减结果集。
      en: Use one query's result inside another, and union, intersect or subtract result sets.
    lessons: []
    planned:
      - { zh: "{{term:scalar-subquery}}与表子查询", en: "{{Term:scalar-subquery|Scalar}} and table subqueries" }
      - { zh: IN 与 EXISTS, en: IN and EXISTS }
      - { zh: "{{term:correlated-subquery}}", en: "{{Term:correlated-subquery|Correlated subqueries}}" }
      - { zh: UNION、INTERSECT 与 EXCEPT, en: "UNION, INTERSECT and EXCEPT" }

  - id: m6
    title: { zh: 进阶查询, en: Advanced queries }
    summary:
      zh: 用 CTE 拆解复杂查询，用窗口函数在不合并行的情况下做排名和累计。
      en: Break complex queries apart with CTEs, and rank or accumulate without collapsing rows using window functions.
    lessons: []
    planned:
      - { zh: CTE 与 WITH 子句, en: CTEs and the WITH clause }
      - { zh: "{{term:recursive-cte}}", en: "{{Term:recursive-cte|Recursive CTEs}}" }
      - { zh: "{{term:window-function}}：排名", en: "{{Term:window-function|Window functions}}: ranking" }
      - { zh: "{{term:window-function}}：偏移与累计", en: "{{Term:window-function|Window functions}}: offsets and running totals" }

  - id: m7
    title: { zh: 修改数据, en: Changing data }
    summary:
      zh: 插入、更新、删除数据，以及用事务保证一组修改要么全部生效、要么全部不生效。
      en: Insert, update and delete rows, and use transactions so a group of changes happens entirely or not at all.
    lessons: []
    planned:
      - { zh: INSERT, en: INSERT }
      - { zh: UPDATE 与 DELETE, en: UPDATE and DELETE }
      - { zh: UPSERT（ON CONFLICT）, en: UPSERT (ON CONFLICT) }
      - { zh: "{{term:transaction}}与 ACID", en: "{{Term:transaction|Transactions}} and ACID" }

  - id: m8
    title: { zh: 数据库设计, en: Database design }
    summary:
      zh: 设计表结构：选类型、加约束、拆分到合适的范式，以及用视图封装查询。
      en: Design tables by choosing types, adding constraints, normalizing, and wrapping queries in views.
    lessons: []
    planned:
      - { zh: "{{term:data-type}}", en: "{{Term:data-type|Data types}}" }
      - { zh: "{{term:constraint}}", en: "{{Term:constraint|Constraints}}" }
      - { zh: "{{term:normalization}}（到 3NF）", en: "{{Term:normalization}} (up to 3NF)" }
      - { zh: "{{term:view}}", en: "{{Term:view|Views}}" }

  - id: m9
    title: { zh: 性能入门, en: Performance basics }
    summary:
      zh: 理解索引为什么快，以及怎样读懂执行计划。
      en: Understand why indexes are fast, and how to read a query plan.
    lessons: []
    planned:
      - { zh: "{{term:index}}", en: "{{Term:index|Indexes}}" }
      - { zh: "用 EXPLAIN 读{{term:query-plan}}", en: "Reading {{term:query-plan|query plans}} with EXPLAIN" }
