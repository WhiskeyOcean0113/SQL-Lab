kind: predict
difficulty: 1
lesson_ref: variants
prompt:
  zh: "`orders` 有 24 笔订单，shop 有 12 位顾客，其中两位从没下过单。下面这条查询返回的数字是多少？"
  en: "`orders` holds 24 orders, and shop has 12 customers, two of whom have never ordered. What number does this query return?"
hint:
  zh: "`DISTINCT` 放在 `count` 的括号里，数的是什么？"
  en: With `DISTINCT` inside `count`'s parentheses, what is being counted?
query: |
  SELECT count(DISTINCT customer_id)
  FROM orders;
choices: ['24', '12', '10']
answer: 2
explain:
  zh: 10。`count(DISTINCT customer_id)` 只数不同的顾客编号：24 笔订单来自 10 位顾客。从没下过单的两位顾客根本不在 `orders` 里，所以也不会被数到。
  en: 10. `count(DISTINCT customer_id)` counts distinct customer ids only, and the 24 orders come from 10 customers. The two who never ordered do not appear in `orders` at all, so they are not counted either.
