kind: predict
difficulty: 2
lesson_ref: variants
prompt:
  zh: 4K Monitor 的库存是 0，价格是 399 美元；其余商品都有库存，也都不超过 300 美元。下面这条查询返回什么？
  en: 4K Monitor has 0 in stock and costs 399 dollars; every other product is in stock and costs 300 dollars or less. What does this query return?
hint:
  zh: "`bool_and` 要每一行都为真，`bool_or` 只要有一行为真。"
  en: "`bool_and` needs every row to be true; `bool_or` needs just one."
query: |
  SELECT bool_and(stock > 0) AS all_in_stock,
         bool_or(price > 300) AS any_over_300
  FROM products;
choices:
  - { zh: "`all_in_stock` 为 true，`any_over_300` 为 true", en: "`all_in_stock` true, `any_over_300` true" }
  - { zh: "`all_in_stock` 为 false，`any_over_300` 为 true", en: "`all_in_stock` false, `any_over_300` true" }
  - { zh: "`all_in_stock` 为 false，`any_over_300` 为 false", en: "`all_in_stock` false, `any_over_300` false" }
  - { zh: "`all_in_stock` 为 true，`any_over_300` 为 false", en: "`all_in_stock` true, `any_over_300` false" }
answer: 1
explain:
  zh: "`all_in_stock` 为 false，`any_over_300` 为 true。4K Monitor 一行就让 `stock > 0` 不再是“每一行都为真”，同时它也让 `price > 300` 变成“至少一行为真”。两个函数都把很多行的真假汇总成一个值，就像 `sum` 把很多行的数字汇总成一个。"
  en: "`all_in_stock` is false and `any_over_300` is true. 4K Monitor alone stops `stock > 0` from being true in every row, and it alone makes `price > 300` true in at least one. Both functions summarise many rows of true and false into one value, much as `sum` summarises many numbers."
