kind: debug
difficulty: 2
lesson_ref: mistakes
prompt:
  zh: 下面这条查询想找出最贵的那件商品，列依次为商品名和价格。它报错了。修好它。
  en: This query should find the most expensive product, with its name and price as the columns. It fails. Fix it.
hint:
  zh: 聚合之后只剩一个汇总值，`name` 放不进来。找“最大的那一行”不需要聚合：排序，再取第一行。
  en: After aggregating only a total is left, and `name` cannot fit. Finding "the row with the largest value" needs no aggregate; sort and take the first row.
starter: |
  SELECT name, max(price)
  FROM products;
solution: |
  SELECT name, price
  FROM products
  ORDER BY price DESC
  LIMIT 1;
