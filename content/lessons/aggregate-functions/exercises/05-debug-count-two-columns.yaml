kind: debug
difficulty: 2
lesson_ref: syntax
prompt:
  zh: "`order_items` 里一共出现了多少种不同的“商品 + 数量”组合？下面这条查询想回答这个问题，返回一列 `combos`。它报错了。修好它。"
  en: How many different combinations of product and quantity appear in `order_items`? This query should answer that in one column, `combos`. It fails. Fix it.
hint:
  zh: 语法里 `count` 的括号里只放一个 `expression`。用一对括号把两列包成一个整体：`(product_id, quantity)`。
  en: "In the syntax, `count`'s parentheses hold a single `expression`. Wrap the two columns in parentheses to make them one: `(product_id, quantity)`."
starter: |
  SELECT count(DISTINCT product_id, quantity) AS combos
  FROM order_items;
solution: |
  SELECT count(DISTINCT (product_id, quantity)) AS combos
  FROM order_items;
check: { column_names: true }
