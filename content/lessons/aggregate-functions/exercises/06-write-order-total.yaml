kind: write
difficulty: 2
lesson_ref: variants
prompt:
  zh: 订单 3 的总金额是多少？每行明细的金额是数量乘单价。返回一列，列名为 `total`。
  en: What is the total value of order 3? Each line is worth its quantity times its unit price. Return one column called `total`.
hint:
  zh: 先用 `WHERE` 留下订单 3 的明细，再对 `quantity * unit_price` 求和。
  en: Keep order 3's lines with `WHERE`, then add up `quantity * unit_price`.
solution: |
  SELECT sum(quantity * unit_price) AS total
  FROM order_items
  WHERE order_id = 3;
check: { column_names: true }
