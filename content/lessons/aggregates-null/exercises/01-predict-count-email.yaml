kind: predict
difficulty: 1
lesson_ref: core
prompt:
  zh: shop 有 12 位顾客，其中 2 位的 `email` 是 NULL。下面这条查询返回哪两个数？
  en: shop has 12 customers, 2 of whom have a NULL `email`. Which two numbers does this query return?
hint:
  zh: "`count(*)` 和 `count(email)` 分别数的是什么？"
  en: What do `count(*)` and `count(email)` each count?
query: |
  SELECT count(*), count(email)
  FROM customers;
choices:
  - { zh: 12 和 12, en: 12 and 12 }
  - { zh: 12 和 10, en: 12 and 10 }
  - { zh: 10 和 10, en: 10 and 10 }
answer: 1
explain:
  zh: 12 和 10。`count(*)` 数行，不管内容；`count(email)` 只数 `email` 不是 NULL 的行。
  en: Twelve and 10. `count(*)` counts rows regardless of content; `count(email)` counts only the rows where `email` is not NULL.
