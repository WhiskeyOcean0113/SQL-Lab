kind: predict
difficulty: 2
lesson_ref: deeper
prompt:
  zh: 没有一件商品的价格超过 1000 美元。下面这条查询返回什么？
  en: No product costs more than 1000 dollars. What does this query return?
hint:
  zh: 没有值可以相加时，`sum` 返回什么？结果有几行？
  en: What does `sum` return when there is nothing to add? How many rows does the result have?
query: |
  SELECT sum(stock)
  FROM products
  WHERE price > 1000;
choices:
  - { zh: 一行，值是 0, en: One row holding 0 }
  - { zh: 一行，值是 NULL, en: One row holding NULL }
  - { zh: 0 行, en: No rows }
answer: 1
verify: { rows: 1 }
explain:
  zh: 一行 NULL。不分组的聚合永远返回一行；没有值可以相加，`sum` 的结果是 NULL 而不是 0。只有 `count` 会返回 0。需要 0 就写 `COALESCE(sum(stock), 0)`。
  en: One row holding NULL. An ungrouped aggregate always returns one row, and with nothing to add, `sum` gives NULL rather than 0. Only `count` returns 0. If you need 0, write `COALESCE(sum(stock), 0)`.
