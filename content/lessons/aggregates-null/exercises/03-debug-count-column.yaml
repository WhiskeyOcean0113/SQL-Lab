kind: debug
difficulty: 2
lesson_ref: mistakes
prompt:
  zh: 下面这条查询想统计每个国家有多少位顾客，列依次为国家和顾客数。它能运行，但 Brazil 和 Ireland 显示 0，而它们各有一位顾客。修好它。
  en: This query should count the customers in each country, with the country and the number of customers as the columns. It runs, but Brazil and Ireland show 0, although each has one customer. Fix it.
hint:
  zh: Brazil 和 Ireland 的顾客城市是 NULL。数行应该用哪种 `count`？
  en: The customers in Brazil and Ireland have a NULL city. Which form of `count` counts rows?
starter: |
  SELECT country, count(city) AS customers
  FROM customers
  GROUP BY country;
solution: |
  SELECT country, count(*) AS customers
  FROM customers
  GROUP BY country;
