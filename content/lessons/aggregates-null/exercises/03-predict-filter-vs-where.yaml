kind: predict
difficulty: 2
lesson_ref: variants
prompt:
  zh: "`orders` 有 24 个订单，其中 2 个已取消（`cancelled`），4 个待处理（`pending`）。下面这条查询返回什么？"
  en: "`orders` holds 24 orders: 2 are cancelled and 4 are pending. What does this query return?"
hint:
  zh: "`WHERE` 去掉的行，所有聚合都看不到；`FILTER` 只影响它所附着的那个聚合。"
  en: Rows removed by `WHERE` are invisible to every aggregate; `FILTER` affects only the aggregate it is attached to.
query: |
  SELECT count(*) AS a,
         count(*) FILTER (WHERE status = 'pending') AS b
  FROM orders
  WHERE status <> 'cancelled';
choices:
  - { zh: "`a` 是 22，`b` 是 4", en: "`a` is 22, `b` is 4" }
  - { zh: "`a` 是 24，`b` 是 4", en: "`a` is 24, `b` is 4" }
  - { zh: "`a` 是 22，`b` 是 22", en: "`a` is 22, `b` is 22" }
  - { zh: "`a` 是 4，`b` 是 4", en: "`a` is 4, `b` is 4" }
answer: 0
explain:
  zh: "`a` 是 22，`b` 是 4。`WHERE` 先去掉 2 个已取消的订单，两个聚合都只看到剩下的 22 行，所以 `a` 是 22。`FILTER` 只对 `b` 起作用，在这 22 行里再挑出 4 个待处理的订单，`a` 不受影响。"
  en: "`a` is 22 and `b` is 4. `WHERE` removes the 2 cancelled orders first, so both aggregates see only the remaining 22 rows, and `a` is 22. `FILTER` applies to `b` alone and picks the 4 pending orders out of those 22; `a` is unaffected."
