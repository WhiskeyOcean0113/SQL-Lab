kind: write
difficulty: 2
lesson_ref: core
prompt:
  zh: |
    按状态统计订单：每种状态一行，列依次为 `status`、订单数 `orders`，以及其中已经有发货时间（`shipped_at` 不是 NULL）的订单数 `shipped`。
  en: |
    Summarise orders by status: one row per status, with the columns `status`, the number of orders `orders`, and how many of them have a shipping time (`shipped_at` is not NULL), `shipped`.
hint:
  zh: "`count(shipped_at)` 只数 `shipped_at` 不是 NULL 的行。"
  en: "`count(shipped_at)` counts only the rows where `shipped_at` is not NULL."
solution: |
  SELECT status, count(*) AS orders, count(shipped_at) AS shipped
  FROM orders
  GROUP BY status;
check: { column_names: true }
