kind: parsons
difficulty: 2
lesson_ref: variants
prompt:
  zh: 用下面的片段拼出一条查询：一行里同时给出订单总数 `all_orders` 和已取消订单的数量 `cancelled`。有两个片段是多余的。
  en: Arrange the pieces into a query that returns, in one row, the total number of orders `all_orders` and the number of cancelled orders `cancelled`. Two pieces are not needed.
hint:
  zh: "`count(status = 'cancelled')` 会数所有行，因为比较的结果不是 NULL。只汇总部分行要用 `FILTER`。"
  en: "`count(status = 'cancelled')` counts every row, since the comparison is never NULL. To summarise only some rows, use `FILTER`."
solution: |
  SELECT count(*) AS all_orders,
         count(*) FILTER (WHERE status = 'cancelled') AS cancelled
  FROM orders;
distractors:
  - count(status = 'cancelled') AS cancelled
  - WHERE status = 'cancelled'
check: { column_names: true }
