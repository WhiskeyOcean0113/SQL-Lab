kind: write
difficulty: 2
lesson_ref: variants
prompt:
  zh: Folding Chair（商品 16）一共卖出了多少件？返回一列 `units`；如果一件都没卖出，要显示 0，而不是 NULL。
  en: How many Folding Chairs (product 16) have been sold in total? Return one column, `units`, showing 0 rather than NULL if none were sold.
hint:
  zh: 没有行可加时 `sum` 返回 NULL，用 `COALESCE(…, 0)` 换成 0。
  en: "`sum` returns NULL when there are no rows to add; `COALESCE(…, 0)` turns that into 0."
solution: |
  SELECT COALESCE(sum(quantity), 0) AS units
  FROM order_items
  WHERE product_id = 16;
check: { column_names: true }
