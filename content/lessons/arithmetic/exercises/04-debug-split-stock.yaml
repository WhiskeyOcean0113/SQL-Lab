kind: debug
difficulty: 2
lesson_ref: mistakes
prompt:
  zh: |
    下面这条查询想算出每件商品的库存平均分成 3 份后，每份是多少件，保留两位小数，列依次为 `name` 和 `per_share`。The Pragmatic Programmer 的结果应该是 8.33，现在却是 8.00。修好它。
  en: |
    This query should show each product's stock split into 3 equal shares, rounded to two decimal places, as the columns `name` and `per_share`. The Pragmatic Programmer should come out at 8.33 but shows 8.00. Fix it.
hint:
  zh: "`stock` 和 3 都是整数，除法在 `round` 之前就已经把小数截掉了。"
  en: "`stock` and 3 are both integers, so the division drops the fraction before `round` runs."
starter: |
  SELECT name, round(stock / 3, 2) AS per_share
  FROM products;
solution: |
  SELECT name, round(stock / 3.0, 2) AS per_share
  FROM products;
check: { column_names: true }
