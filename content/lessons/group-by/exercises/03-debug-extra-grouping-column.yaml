kind: debug
difficulty: 2
lesson_ref: mistakes
prompt:
  zh: 下面这条查询想统计每位顾客的订单数，每位顾客一行，列依次为顾客编号和订单数。它报错了。修好它，注意别改变“每位顾客一行”的意思。
  en: This query should count each customer's orders, one row per customer, with the customer id and the number of orders as the columns. It fails. Fix it without changing the meaning of "one row per customer".
hint:
  zh: 报错提示你把 `status` 加进 `GROUP BY`，但那样每组就成了“一位顾客的一种状态”。题目需要 `status` 吗？
  en: The error suggests adding `status` to `GROUP BY`, but then each group becomes "one status of one customer". Does the task need `status` at all?
starter: |
  SELECT customer_id, status, count(*) AS orders
  FROM orders
  GROUP BY customer_id;
solution: |
  SELECT customer_id, count(*) AS orders
  FROM orders
  GROUP BY customer_id;
