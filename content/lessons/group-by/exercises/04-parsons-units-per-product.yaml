kind: parsons
difficulty: 1
lesson_ref: example
prompt:
  zh: 用下面的片段拼出一条查询：每件被订购过的商品一共卖出了多少件？列依次为 `product_id` 和 `units`。有两个片段是多余的。
  en: Arrange the pieces into a query showing how many items of each ordered product were sold, with the columns `product_id` and `units`. Two pieces are not needed.
hint:
  zh: “每件商品一行”说明按什么分组？卖出的件数要对 `quantity` 求和。
  en: '"One row per product" tells you what to group by. Items sold means adding up `quantity`.'
solution: |
  SELECT product_id, sum(quantity) AS units
  FROM order_items
  GROUP BY product_id;
distractors:
  - SELECT product_id, quantity AS units
  - GROUP BY quantity
check: { column_names: true }
