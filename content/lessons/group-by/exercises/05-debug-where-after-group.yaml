kind: debug
difficulty: 1
lesson_ref: syntax
prompt:
  zh: 下面这条查询想统计每个分类里库存超过 10 件的商品有几件，列名依次为 `category_id` 和 `products`。它报错了。修好它。
  en: This query should count, for each category, the products with more than 10 units in stock, as the columns `category_id` and `products`. It fails. Fix it.
hint:
  zh: 书写顺序是 `WHERE` → `GROUP BY` → `ORDER BY`，和逻辑顺序一样：先筛选行，再分组。
  en: "The written order is `WHERE` → `GROUP BY` → `ORDER BY`, the same as the logical order: filter rows first, then group them."
starter: |
  SELECT category_id, count(*) AS products
  FROM products
  GROUP BY category_id
  WHERE stock > 10;
solution: |
  SELECT category_id, count(*) AS products
  FROM products
  WHERE stock > 10
  GROUP BY category_id;
check: { column_names: true }
