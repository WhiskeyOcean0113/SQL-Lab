kind: predict
difficulty: 1
lesson_ref: core
prompt:
  zh: 10 位顾客下过订单：顾客 1 有 4 笔，顾客 2 和 3 各有 3 笔，其余 7 位各有 2 笔。下面这条查询会返回几行？
  en: Ten customers have ordered. Customer 1 has 4 orders, customers 2 and 3 have 3 each, and the other 7 have 2 each. How many rows does this query return?
hint:
  zh: "`HAVING` 去掉不满足条件的整组。"
  en: "`HAVING` removes whole groups that fail the condition."
query: |
  SELECT customer_id, count(*)
  FROM orders
  GROUP BY customer_id
  HAVING count(*) >= 3;
choices: ['1', '3', '10']
answer: 1
verify: { rows: 3 }
explain:
  zh: 3 行。先分成 10 组，`HAVING` 再去掉订单少于 3 笔的组，剩下顾客 1、2、3。
  en: Three rows. The orders form 10 groups, and `HAVING` then removes the groups with fewer than 3 orders, leaving customers 1, 2 and 3.
