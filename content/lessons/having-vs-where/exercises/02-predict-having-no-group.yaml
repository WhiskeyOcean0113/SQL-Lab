kind: predict
difficulty: 2
lesson_ref: variants
prompt:
  zh: "`orders` 一共有 24 行。下面这条查询会返回几行？"
  en: "`orders` has 24 rows. How many rows does this query return?"
hint:
  zh: 没有 `GROUP BY` 时，整张表是一组。这一组满足 `HAVING` 的条件吗？
  en: Without `GROUP BY` the whole table is one group. Does that group pass the `HAVING` condition?
query: |
  SELECT count(*)
  FROM orders
  HAVING count(*) > 100;
choices: ['0', '1', '24']
answer: 0
verify: { rows: 0 }
explain:
  zh: 0 行。没有 `GROUP BY` 时整张表是一组，聚合后本来有一行（`count` 为 24），但 24 不大于 100，`HAVING` 把这一组去掉了。
  en: Zero rows. Without `GROUP BY` the whole table is one group, which aggregates to one row (a `count` of 24), but 24 is not more than 100, so `HAVING` removes the group.
