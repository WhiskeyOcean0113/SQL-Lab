kind: debug
difficulty: 1
lesson_ref: core
prompt:
  zh: 下面这条查询想找出下过至少 3 笔订单的顾客，列依次为顾客编号和订单数。它报错了。修好它。
  en: This query should find the customers with at least 3 orders, with the customer id and the number of orders as the columns. It fails. Fix it.
hint:
  zh: "`WHERE` 在分组之前执行，那时还没有 `count(*)`。对组的条件放在哪里？"
  en: "`WHERE` runs before grouping, when `count(*)` does not exist yet. Where do conditions on groups go?"
starter: |
  SELECT customer_id, count(*) AS orders
  FROM orders
  WHERE count(*) >= 3
  GROUP BY customer_id;
solution: |
  SELECT customer_id, count(*) AS orders
  FROM orders
  GROUP BY customer_id
  HAVING count(*) >= 3;
