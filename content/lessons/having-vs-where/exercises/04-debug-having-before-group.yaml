kind: debug
difficulty: 1
lesson_ref: syntax
prompt:
  zh: 下面这条查询想找出至少有 3 行明细的订单，列名依次为 `order_id` 和 `lines`。它报错了。修好它。
  en: This query should find the orders with at least 3 lines, as the columns `order_id` and `lines`. It fails. Fix it.
hint:
  zh: 在语法里，`HAVING` 紧跟在 `GROUP BY` 之后。
  en: In the syntax, `HAVING` comes right after `GROUP BY`.
starter: |
  SELECT order_id, count(*) AS lines
  FROM order_items
  HAVING count(*) >= 3
  GROUP BY order_id;
solution: |
  SELECT order_id, count(*) AS lines
  FROM order_items
  GROUP BY order_id
  HAVING count(*) >= 3;
check: { column_names: true }
