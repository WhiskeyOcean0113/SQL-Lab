kind: write
difficulty: 3
lesson_ref: mistakes
prompt:
  zh: |
    找出至少有 3 笔**未取消**订单的顾客。列依次为 `customer_id` 和这些未取消订单的数量 `orders`。
  en: |
    Find the customers with at least 3 orders that were **not cancelled**. The columns are `customer_id` and the number of those orders, `orders`.
hint:
  zh: 两个条件：“未取消”看一行就能判断，放 `WHERE`；“至少 3 笔”要先数，放 `HAVING`。
  en: 'Two conditions: "not cancelled" is decidable from one row, so `WHERE`; "at least 3" needs a count first, so `HAVING`.'
solution: |
  SELECT customer_id, count(*) AS orders
  FROM orders
  WHERE status <> 'cancelled'
  GROUP BY customer_id
  HAVING count(*) >= 3;
check: { column_names: true }
