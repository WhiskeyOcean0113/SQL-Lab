kind: write
difficulty: 2
lesson_ref: example
prompt:
  zh: |
    哪些分类的库存总量超过 100 件？每个 `category_id` 一行，列依次为 `category_id` 和库存总量 `stock`。没有分类的商品也算作一组。
  en: |
    Which categories hold more than 100 items of stock in total? One row per `category_id`, with the columns `category_id` and the total stock `stock`. Products without a category count as a group too.
hint:
  zh: 按 `category_id` 分组，对 `stock` 求和，再用 `HAVING` 筛选。别名不能用在 `HAVING` 里。
  en: Group by `category_id`, add up `stock`, then filter with `HAVING`. The alias cannot be used in `HAVING`.
solution: |
  SELECT category_id, sum(stock) AS stock
  FROM products
  GROUP BY category_id
  HAVING sum(stock) > 100;
check: { column_names: true }
