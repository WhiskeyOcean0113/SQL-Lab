kind: predict
difficulty: 1
lesson_ref: variants
prompt:
  zh: 订单 3 里买了三种不同的商品。下面这条查询会返回几行？
  en: Order 3 contains three different products. How many rows does this query return?
hint:
  zh: "`order_items` 的一行是“某笔订单里的一种商品”。"
  en: A row of `order_items` is one product within one order.
query: SELECT * FROM order_items WHERE order_id = 3;
choices: ['1', '3', '42']
answer: 1
verify: { rows: 3 }
explain:
  zh: 3 行。`order_items` 的主键是 `(order_id, product_id)` 这一对，所以同一个 `order_id` 可以出现多次，只要每次的商品不同。订单 3 买了三种商品，就占三行。
  en: 3 rows. The primary key of `order_items` is the pair `(order_id, product_id)`, so the same `order_id` may appear several times as long as the product differs each time. Order 3 has three products, so it takes three rows.
