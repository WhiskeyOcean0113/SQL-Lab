kind: predict
difficulty: 1
lesson_ref: core
prompt:
  zh: 12 位顾客一共下了 24 笔订单，其中两位顾客从没下过单。下面这条查询会返回几行？
  en: The 12 customers have placed 24 orders between them, and two customers have never ordered. How many rows does this query return?
hint:
  zh: 先算内连接有几行，再加上左表里一次都没配上的行。
  en: Work out the inner join's rows, then add the left rows that never matched.
query: |
  SELECT c.name, o.id
  FROM customers AS c
  LEFT JOIN orders AS o ON o.customer_id = c.id;
choices: ['12', '24', '26', '288']
answer: 2
verify: { rows: 26 }
explain:
  zh: 26 行。24 笔订单各配对一次，再加上没下过单的两位顾客各一行，这两行的 `o.id` 是 NULL。
  en: Twenty-six rows. Each of the 24 orders pairs once, and the two customers who never ordered add one row each, with a NULL `o.id`.
