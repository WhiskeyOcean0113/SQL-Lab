kind: predict
difficulty: 2
lesson_ref: syntax
prompt:
  zh: shop 有 16 件商品和 5 个分类。每个分类至少有一件商品，只有一件商品（Gift Card）没有分类。下面这条查询会返回几行？
  en: shop has 16 products and 5 categories. Every category has at least one product, and only one product (Gift Card) has no category. How many rows does this query return?
hint:
  zh: "`FULL` 两边没匹配上的行都保留。这里哪一边有没匹配上的行？"
  en: "`FULL` keeps the unmatched rows of both sides. Which side has any here?"
query: |
  SELECT p.name AS product, c.name AS category
  FROM products AS p
  FULL JOIN categories AS c ON c.id = p.category_id;
choices: ['15', '16', '17', '21']
answer: 1
verify: { rows: 16 }
explain:
  zh: 16 行。15 件有分类的商品各匹配一个分类；Gift Card 没有匹配，作为左边没匹配上的行保留，分类列是 NULL。右边每个分类都匹配到了商品，没有要额外补上的行。所以结果和 `LEFT JOIN` 一样，是 16 行。
  en: 16 rows. The 15 products with a category each match one; Gift Card matches nothing and stays as an unmatched left row, with NULL for the category. On the right, every category matched at least one product, so there is nothing more to add. The result is the same 16 rows a `LEFT JOIN` would give.
