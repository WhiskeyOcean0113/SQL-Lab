kind: predict
difficulty: 1
lesson_ref: deeper
prompt:
  zh: 运行下面的查询，看看 `customers` 的全部内容。下面哪一列里出现了 NULL？
  en: Run the query below to see all of `customers`. Which of these columns contains NULL?
hint:
  zh: 逐列往下看，找写着 NULL 的格子。
  en: Go down each column looking for a cell that says NULL.
query: SELECT * FROM customers;
choices: ['name', 'country', 'email', 'joined_on']
answer: 2
verify: { rows: 12 }
explain:
  zh: "`email`。Noah Martin 和 Mei Tanaka 的 `email` 是 NULL：shop 不知道他们的邮箱。`name`、`country`、`joined_on` 每一行都有值，因为建表时规定了它们不能为空。"
  en: "`email`. Noah Martin and Mei Tanaka have NULL in `email`: shop does not know their addresses. `name`, `country` and `joined_on` have a value in every row, because the table was created to require one."
