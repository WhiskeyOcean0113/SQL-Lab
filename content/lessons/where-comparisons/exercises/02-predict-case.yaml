kind: predict
difficulty: 1
lesson_ref: deeper
prompt:
  zh: shop 有 3 位来自 China 的顾客。下面这条查询会返回几行？
  en: Three shop customers are from China. How many rows does this query return?
hint:
  zh: 仔细看字面量的大小写。
  en: Look closely at the case of the literal.
query: |
  SELECT name
  FROM customers
  WHERE country = 'china';
choices:
  - '3'
  - '0'
  - { zh: 查询会报错, en: The query fails }
answer: 1
verify: { rows: 0 }
explain:
  zh: 0 行，而且不报错。PostgreSQL 比较文字时区分大小写，数据里存的是 `'China'`，`'china'` 和它不相等。这类错误很难发现，因为查询看起来完全正常。
  en: 0 rows, and no error. PostgreSQL compares text case-sensitively; the data holds `'China'`, which is not equal to `'china'`. Mistakes like this are hard to spot because the query looks perfectly fine.
