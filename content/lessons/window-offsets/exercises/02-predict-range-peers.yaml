kind: predict
difficulty: 3
lesson_ref: deeper
prompt:
  zh: 订单 1 有两种商品，件数是 1 和 2；订单 2 有一种，件数是 1；订单 3 有三种，件数是 2、1、3。下面这条查询里，订单 3 的每一行 `running` 是多少？
  en: "Order 1 has two items with quantities 1 and 2; order 2 has one, quantity 1; order 3 has three, quantities 2, 1 and 3. In this query, what is `running` on each of order 3's rows?"
hint:
  zh: 默认的帧是 `RANGE`。`order_id` 相同的行是同级行。
  en: The default frame is `RANGE`, and rows with the same `order_id` are peers.
query: |
  SELECT order_id, product_id, quantity,
         sum(quantity) OVER (ORDER BY order_id) AS running
  FROM order_items
  WHERE order_id <= 3
  ORDER BY order_id, product_id;
choices:
  - { zh: 依次是 6、7、10, en: "6, 7 and 10, one after another" }
  - { zh: 三行都是 10, en: 10 on all three rows }
  - { zh: 三行都是 6, en: 6 on all three rows }
answer: 1
verify: { rows: 6 }
explain:
  zh: 三行都是 10。默认的帧是 `RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW`，它的终点是和当前行 `order_id` 相同的最后一行。订单 3 的三行是同级行，一起计入：1 + 2 + 1 + 2 + 1 + 3 = 10。要逐行累计，让 `ORDER BY` 唯一，比如 `ORDER BY order_id, product_id`。
  en: "10 on all three. The default frame is `RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW`, which ends at the last row with the current row's `order_id`. Order 3's three rows are peers and enter together: 1 + 2 + 1 + 2 + 1 + 3 = 10. For a row-by-row total, make `ORDER BY` unique, for example `ORDER BY order_id, product_id`."
