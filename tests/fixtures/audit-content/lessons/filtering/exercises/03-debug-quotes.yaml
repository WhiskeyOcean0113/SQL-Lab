kind: debug
difficulty: 1
lesson_ref: mistakes
prompt:
  zh: 这条查询想找出家具，却报错了。改好它。
  en: This query is meant to find the furniture but fails. Fix it.
hint:
  zh: 文字要放在单引号里。
  en: Text goes in single quotes.
starter: |
  SELECT name FROM items WHERE category = furniture;
solution: |
  SELECT name FROM items WHERE category = 'furniture';
explain:
  zh: 没有引号时，`furniture` 被当成列名。
  en: Without quotes, `furniture` is read as a column name.
