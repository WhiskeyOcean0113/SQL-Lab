kind: write
difficulty: 1
objective: basics/pick-columns
prompt: { zh: 列出每只宠物的 `id` 和 `name`。, en: "List every pet's `id` and `name`." }
explain:
  zh: "`SELECT id, name` 按题目的顺序取出两列，`FROM pets` 指明{{term:table}}。"
  en: "`SELECT id, name` picks the two columns in the order asked, and `FROM pets` names the {{term:table}}."
solution: SELECT id, name FROM pets
